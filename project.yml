name: Metronome
options:
  bundleIdPrefix: io.moul
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  supportedDestinations: [iOS, macOS, watchOS]

settings:
  base:
    SWIFT_VERSION: "5.9"

packages:
  MetronomeCore:
    path: MetronomeCore

targets:
  Metronome:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Metronome
        excludes:
          - "**/.DS_Store"
          - "**/Info.plist"
    resources:
      - path: Metronome/Resources
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Metronome/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.moul.metronome
        SWIFT_OBJC_BRIDGING_HEADER: Metronome/Metronome-Bridging-Header.h
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: MetronomeCore
    entitlements:
      path: Metronome/Metronome.entitlements

  MetronomeWatch:
    type: application
    platform: watchOS
    deploymentTarget:
      watchOS: "10.0"
    sources:
      - path: Metronome
        excludes:
          - "**/.DS_Store"
          - "**/Info.plist"
          - "Audio/AudioEngine.h"
          - "Audio/AudioEngine.m"
          - "Audio/AudioEngine-Bridging.swift"
          - "Audio/AudioSessionManager.swift"
    settings:
      base:
        INFOPLIST_FILE: Metronome/Info-watchOS.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.moul.metronome.watch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SDKROOT: watchos
    dependencies:
      - package: MetronomeCore

schemes:
  Metronome:
    build:
      targets:
        Metronome: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  MetronomeWatch:
    build:
      targets:
        MetronomeWatch: all
    run:
      config: Debug
    test:
      config: Debug
