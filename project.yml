name: Metronome
options:
  bundleIdPrefix: io.moul
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

packages:
  MetronomeCore:
    path: MetronomeCore

targets:
  Metronome:
    type: application
    platform: iOS
    sources:
      - path: Metronome
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Metronome/Resources
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Metronome/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.moul.metronome
        SWIFT_OBJC_BRIDGING_HEADER: Metronome/Metronome-Bridging-Header.h
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: MetronomeCore
    entitlements:
      path: Metronome/Metronome.entitlements
    preBuildScripts: []
    postBuildScripts: []

schemes:
  Metronome:
    build:
      targets:
        Metronome: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
